<script>
// ── Storage: in-memory + Supabase ────────────────────────────────────────────
window._sharedStore = {};
window._personalStore = {};

// Load personal from localStorage
try {
  const p = localStorage.getItem('clep_personal');
  if (p) window._personalStore = JSON.parse(p);
} catch(e) {}

// Load shared cache (used while Supabase loads)
try {
  const s = localStorage.getItem('clep_shared_cache');
  if (s) window._sharedStore = JSON.parse(s);
} catch(e) {}

window._sb = null;

async function connectSupabase() {
  const url = document.getElementById('sb-url').value.trim();
  const key = document.getElementById('sb-key').value.trim();
  document.getElementById('config-error').style.display = 'none';

  if (!url || !key) {
    document.getElementById('config-error').textContent = 'Both fields are required.';
    document.getElementById('config-error').style.display = 'block';
    return;
  }

  try {
    const client = supabase.createClient(url, key);
    // Test connection
    const {error} = await client.from('kv').select('key').limit(1);
    if (error) throw error;

    window._sb = client;
    localStorage.setItem('clep_sb_url', url);
    localStorage.setItem('clep_sb_key', key);

    // Start real-time subscription
    startRealtimeSync(client);

    document.getElementById('config-screen').style.display = 'none';
    document.getElementById('root').style.display = '';
    mountApp();
  } catch(e) {
    document.getElementById('config-error').textContent = 'Connection failed: ' + (e.message || e);
    document.getElementById('config-error').style.display = 'block';
  }
}

// Auto-connect if credentials saved
window.addEventListener('DOMContentLoaded', async () => {
  const savedUrl = localStorage.getItem('clep_sb_url');
  const savedKey = localStorage.getItem('clep_sb_key');
  if (savedUrl && savedKey) {
    document.getElementById('sb-url').value = savedUrl;
    document.getElementById('sb-key').value = savedKey;
    await connectSupabase();
  }
});

function startRealtimeSync(client) {
  // Real-time: when any key changes in Supabase, update local cache
  client
    .channel('kv-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kv' }, (payload) => {
      if (payload.new && payload.new.key) {
        window._sharedStore[payload.new.key] = payload.new.value;
        try{localStorage.setItem('clep_shared_cache',JSON.stringify(window._sharedStore));}catch(e){}
      }
    })
    .subscribe();
}

function mountApp() {
  // Defined below in Babel script
  if (window._mountApp) window._mountApp();
}
</script>

function normalizeHeader(h){ return String(h||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function matchColumn(header){
  const norm=normalizeHeader(header);
  for(const field of Object.keys(IMPORT_ALIASES)){
    if(IMPORT_ALIASES[field].some(a=>normalizeHeader(a)===norm)) return field;
  }
  return null;
}
function makeId(p){ return `${p}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`; }
function todayStamp(){
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function blankPanelist(){
  const p={id:makeId("p"),name:"",table:"",panelistId:"",panelistCode:"",cellPhone:""};
  TRACKER_BOOL_COLS.forEach(c=>p[c.key]=false);
  return p;
}
async function storageGet(key,shared){
  try{
    if(shared){
      if(window._sb){
        const {data,error}=await window._sb.from('kv').select('value').eq('key',key).maybeSingle();
        if(!error&&data) return data.value;
      }
      return window._sharedStore[key]!==undefined?window._sharedStore[key]:null;
    }
    return window._personalStore[key]!==undefined?window._personalStore[key]:null;
  }catch(e){return null;}
}
async function storageSet(key,value,shared){
  try{
    if(shared){
      window._sharedStore[key]=value;
      if(window._sb){
        await window._sb.from('kv').upsert({key,value,updated_at:new Date().toISOString()},{onConflict:'key'});
      }
      try{localStorage.setItem('clep_shared_cache',JSON.stringify(window._sharedStore));}catch(ex){}
    } else {
      window._personalStore[key]=value;
      try{localStorage.setItem('clep_personal',JSON.stringify(window._personalStore));}catch(ex){}
    }
    return true;
  }catch(e){console.error("storageSet",key,e);return false;}
}
function safeParse(json,fb){
  if(!json) return fb;
  try{ const p=JSON.parse(json); return p&&typeof p==="object"?p:fb; }
  catch(e){ return fb; }
}

  };
}
function slugify(name,existing){
  let base=String(name||"role").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"role";
  let id=base, i=2;
  while(existing.includes(id)){ id=`${base}-${i}`; i++; }
  return id;
}
function nextColor(roles){
  const used=new Set(roles.map(r=>r.color));
  return CUSTOM_ROLE_PALETTE.find(c=>!used.has(c))||CUSTOM_ROLE_PALETTE[roles.length%CUSTOM_ROLE_PALETTE.length];
}
function getRole(roles,id){ return roles.find(r=>r.id===id)||null; }
function effectiveRoles(task,assignments){
  const ov=assignments[task.id];
  if(Array.isArray(ov)&&ov.length) return ov;
  // task.role can be a string (single role) or array (multi-role from Excel)
  if(Array.isArray(task.role)) return task.role;
  return [task.role];
}
function resolveTaskText(task,textOverrides,examName){
  const base=textOverrides[task.id]||task.text;
  return base.replace(/\{EXAM\}/g,examName||"CLEP");
}

function RoleFilter({roles,active,onChange,rsNames=[]}){
  const activeArr=Array.isArray(active)?active:[];
  const isAll=activeArr.length===0;
  // rsNames: array of {name, key:"rs__name"} derived from assignee fields
  const activeRsNames=activeArr.filter(f=>f.startsWith("rs__"));
  const activeRoles=activeArr.filter(f=>!f.startsWith("rs__"));

  function toggle(id){
    if(activeArr.includes(id)) onChange(activeArr.filter(r=>r!==id));
    else onChange([...activeArr,id]);
  }
  const RS_COLOR="#C2255C";
  return(
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      <div className="role-filter-row">
        <button className={`rf-chip ${isAll?"rf-active":""}`} onClick={()=>onChange([])}>All roles</button>
        {roles.filter(r=>r.id!=="allstaff").map(r=>(
          <button key={r.id} className={`rf-chip ${activeRoles.includes(r.id)?"rf-active":""}`}
            style={activeRoles.includes(r.id)?{background:`${r.color}22`,color:r.color,borderColor:`${r.color}55`}:{}}
            onClick={()=>toggle(r.id)}>
            {r.abbr&&r.abbr.trim()?r.abbr:r.name}

      </div>

              style={activeRsNames.includes(key)?{background:`${RS_COLOR}22`,color:RS_COLOR,borderColor:`${RS_COLOR}55`}:{borderStyle:"dashed"}}

              {name}

          ))}
        </div>
      )}
    </div>
  );
}

function ProgressBar({value,total}){
  const pct=total>0?Math.min(100,Math.round((value/total)*100)):0;
  return(
    <div className="prog-track" role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100}>
      <div className="prog-fill" style={{width:`${pct}%`}}/>
    </div>
  );
}

function ProgressRing({value,total,size=44}){
  const pct=total>0?Math.min(1,value/total):0;
  const r=(size-6)/2, c=2*Math.PI*r, offset=c*(1-pct);
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#E4E7EC" strokeWidth="4"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--accent)" strokeWidth="4"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dashoffset .4s ease"}}/>
      <text x="50%" y="52%" textAnchor="middle" dominantBaseline="middle" className="ring-txt">
        {total>0?Math.round(pct*100):0}%
      </text>
    </svg>
  );
}

function TaskPhasePage({phase,roles,taskAssignments,taskTexts,taskDueDates,onDueDateChange,examName,completedMap,notes,onToggleTask,onNotesChange,sessionDates,taskNotes,onTaskNoteChange,roleFilter,setRoleFilter,rsNames}){
  const tasks=DEFAULT_TASKS[phase.key];
  const sd=sessionDates||{};

  const matchesFilter=useCallback((task)=>{
    if(roleFilter.length===0) return true;
    const activeRoles=roleFilter.filter(f=>!f.startsWith("rs__"));
    const activeRsNames=roleFilter.filter(f=>f.startsWith("rs__"));
    const rr=effectiveRoles(task,taskAssignments);
    const roleMatch=activeRoles.length===0||rr.includes("allstaff")||activeRoles.some(f=>rr.includes(f));
    if(activeRsNames.length===0) return roleMatch;
    // RS name filters only apply to tasks that have an assignee field AND include RS in their roles
    if(!task.hasAssignee||!rr.includes("rs")) {
      // If only RS name filters are active (no role chips), hide non-assignee RS tasks
      if(activeRoles.length===0) return false;
      return roleMatch;
    }
    const assignee=(taskNotes&&taskNotes[task.id+"__assignee"])||"";
    const assigneeNames=assignee.split(/[,;]/).map(n=>n.trim().toLowerCase().replace(/\s+/g,"_"));
    const nameMatch=activeRsNames.some(key=>{
      const namePart=key.replace("rs__","");
      return assigneeNames.includes(namePart);
    });
    return nameMatch;
  },[taskAssignments,roleFilter,taskNotes]);

  const visibleTasks=useMemo(()=>tasks.filter(matchesFilter),[tasks,matchesFilter]);
  const doneCount=tasks.filter(t=>completedMap[t.id]).length;
  const phaseDateKey=PHASE_DATE_KEYS[phase.key];
  const phaseDateVal=phaseDateKey?sd[phaseDateKey]:"";
  const phaseDateColor=PHASE_DATE_COLORS[phase.key]||"var(--accent)";

  function renderRow(task){
    const roleIds=effectiveRoles(task,taskAssignments);
    const done=!!completedMap[task.id];
    const displayText=resolveTaskText(task,taskTexts,examName);
    const noteVal=(taskNotes&&taskNotes[task.id])!==undefined?(taskNotes&&taskNotes[task.id]):undefined;
    return(
      <div key={task.id} className={`task-row-wrap ${done?"task-done":""}`}>
        <div className="task-row">
          <label className="task-main">
            <input type="checkbox" checked={done} onChange={()=>onToggleTask(phase.key,task.id)} className="task-cb"/>
            <span className="task-text">{displayText}</span>
          </label>
          <div className="task-meta">
            <div className="badge-group">
              {roleIds.map(rid=><RoleBadge key={rid} role={getRole(roles,rid)}/>)}
            </div>
            {phase.hasDueDates&&(
              <label className="due-date-field">
                <span className="due-date-label">Due</span>
                <input type="date" className="due-date-input"
                  value={(taskDueDates&&taskDueDates[task.id])||""}
                  onChange={e=>onDueDateChange(task.id,e.target.value)}
                  aria-label="Due date"/>
              </label>
            )}
          </div>
        </div>
        {task.hasNote&&(
          <div className="task-note-row">
            <span className="task-note-label">Note</span>
            <input className="task-note-input" placeholder={task.noteDefault||"Add a note…"}
              value={noteVal!==undefined?noteVal:""}
              onChange={e=>onTaskNoteChange(task.id,e.target.value)}/>
          </div>
        )}
        {task.hasAssignee&&(
          <div className="task-note-row">
            <span className="task-note-label assignee-label">RS</span>
            <input className="task-note-input assignee-input"
              placeholder="Assigned to (e.g. Nikhil, Brittany, John)…"
              value={(taskNotes&&taskNotes[task.id+"__assignee"])||""}
              onChange={e=>onTaskNoteChange(task.id+"__assignee",e.target.value)}/>
          </div>
        )}
      </div>
    );
  }

  return(
    <div className="page">
      <div className="page-head">
        <div>
          <div className="eyebrow">{phase.short}</div>
          <h1 className="h1">{phase.label}</h1>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
          {phaseDateVal&&<PhaseDateBadge dateStr={phaseDateVal} label={PHASE_DATE_LABELS[phase.key]||phase.short} color={phaseDateColor}/>}
          <ProgressRing value={doneCount} total={tasks.length} size={52}/>
        </div>
      </div>
      <div className="card toolbar-card">
        <ProgressBar value={doneCount} total={tasks.length}/>
        <div className="toolbar-row" style={{marginTop:10}}>
          <span className="muted">{doneCount} of {tasks.length} tasks complete</span>
          {roleFilter.length>0&&<span className="muted" style={{color:"var(--accent)"}}>· {roleFilter.length} role{roleFilter.length>1?"s":""} filtered</span>}
        </div>
        <RoleFilter roles={roles} active={roleFilter} onChange={setRoleFilter} rsNames={rsNames}/>
      </div>

      {phase.grouped?(
        PRE_GROUPS.map(g=>{
          const gt=visibleTasks.filter(t=>t.group===g.key);
          if(!gt.length) return null;
          const gDone=gt.filter(t=>completedMap[t.id]).length;
          return(
            <Collapsible key={g.key} title={g.label}
              subtitle={(()=>{const gi=PRE_GROUP_DATE_INFO[g.key];const gv=gi&&sd[gi.dateKey]?sd[gi.dateKey]:"";return gv?fmtFull(gv):"";})()}
              badge={`${gDone}/${gt.length}`} defaultOpen={true}>
              {(()=>{const gi=PRE_GROUP_DATE_INFO[g.key];const gv=gi&&sd[gi.dateKey]?sd[gi.dateKey]:"";return gv?<div style={{padding:"0 0 8px"}}><PhaseDateBadge dateStr={gv} label={gi.label} color={gi.color}/></div>:null;})()}
              <div className="task-list">{gt.map(renderRow)}</div>
            </Collapsible>
          );
        })
      ):(
        <div className="card task-list">
          {visibleTasks.length===0
            ?<EmptyState icon={ClipboardList} title="No tasks match this filter" body="Try a different role."/>
            :visibleTasks.map(renderRow)}
        </div>
      )}

      <div className="card">
        <div className="notes-label">Session notes for {phase.short}</div>
        <textarea className="notes-ta" rows={4} value={notes}
          onChange={e=>onNotesChange(phase.key,e.target.value)}
          placeholder={`Add notes for ${phase.short}…`}/>
        <div className="notes-hint">Notes are saved automatically and are personal to your view.</div>
      </div>
    </div>
  );
}

function Tracker({panelists,setPanelists,trackerColumns,setTrackerColumns,addLog}){
  const [colMenuOpen,setColMenuOpen]=useState(false);
  const [addOpen,setAddOpen]=useState(false);
  const [draft,setDraft]=useState(blankPanelist());
  const [pendingUndo,setPendingUndo]=useState(null);
  const [replaceConfirm,setReplaceConfirm]=useState(null);
  const [importError,setImportError]=useState("");
  const undoRef=useRef(null);
  const fileRef=useRef(null);

  useEffect(()=>()=>{if(undoRef.current)clearTimeout(undoRef.current);},[]);

  const visText=TRACKER_TEXT_COLS.filter(c=>trackerColumns[c.key]!==false||c.alwaysVisible);
  const visBool=TRACKER_BOOL_COLS.filter(c=>trackerColumns[c.key]!==false);

  const trackerLogTimerRef=useRef({});
  function updateField(id,key,value){
    setPanelists(prev=>prev.map(p=>p.id===id?{...p,[key]:value}:p));
    const pan=panelists.find(p=>p.id===id);
    const name=pan?.name||id;
    const colLabel=[...TRACKER_TEXT_COLS,...TRACKER_BOOL_COLS].find(c=>c.key===key)?.label||key;
    if(typeof value==="boolean"){
      if(addLog) addLog("Tracker updated",`${name} — ${colLabel}: ${value?"Yes":"No"}`);
    } else {
      // Debounce text field edits
      const timerKey=`${id}_${key}`;
      if(trackerLogTimerRef.current[timerKey]) clearTimeout(trackerLogTimerRef.current[timerKey]);
      if(addLog) trackerLogTimerRef.current[timerKey]=setTimeout(()=>{
        addLog("Tracker field edited",`${name} — ${colLabel}`);
      },1500);
    }
  }
  function addPanelist(){
    if(!draft.name.trim()) return;
    setPanelists(prev=>[{...draft,id:makeId("p")},...prev]);
    if(addLog) addLog("Panelist added",`${draft.name} added to tracker`);
    setDraft(blankPanelist()); setAddOpen(false);
  }
  function remove(id){
    const idx=panelists.findIndex(p=>p.id===id); if(idx===-1) return;
    const removed=panelists[idx];
    if(addLog) addLog("Panelist removed",removed.name||id);
    setPanelists(prev=>prev.filter(p=>p.id!==id));
    if(undoRef.current) clearTimeout(undoRef.current);
    setPendingUndo({panelist:removed,index:idx});
    undoRef.current=setTimeout(()=>setPendingUndo(null),8000);
  }
  function undoRemove(){
    if(!pendingUndo) return;
    setPanelists(prev=>{const c=[...prev];c.splice(Math.min(pendingUndo.index,c.length),0,pendingUndo.panelist);return c;});
    if(undoRef.current) clearTimeout(undoRef.current);
    setPendingUndo(null);
  }
  function parseRows(rows){
    if(!rows.length) return [];
    const headers=Object.keys(rows[0]),map={};
    headers.forEach(h=>{const f=matchColumn(h);if(f)map[h]=f;});
    return rows.map(row=>{
      const p=blankPanelist();
      headers.forEach(h=>{if(map[h])p[map[h]]=String(row[h]||"").trim();});
      p.id=makeId("p"); return p;
    }).filter(p=>p.name);
  }
  function handleFile(e){
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    setImportError("");
    if(/\.csv$/i.test(file.name)){
      const reader=new FileReader();
      reader.onload=()=>{
        Papa.parse(String(reader.result),{header:true,skipEmptyLines:true,
          complete:(res)=>{ const p=parseRows(res.data); if(!p.length){setImportError("No rows found.");return;} setReplaceConfirm(p); },
          error:()=>setImportError("Could not read CSV.")});
      };
      reader.readAsText(file);
    } else {
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const wb=XLSX.read(reader.result,{type:"array"});
          const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
          const p=parseRows(rows); if(!p.length){setImportError("No rows found.");return;} setReplaceConfirm(p);
        }catch(err){setImportError("Could not read Excel file.");}
      };
      reader.readAsArrayBuffer(file);
    }
    e.target.value="";
  }
  function exportXlsx(){
    if(addLog) addLog("Tracker exported",`${panelists.length} panelists exported to Excel`);
    const cols=[...visText,...visBool];
    const rows=panelists.map(p=>{const r={};cols.forEach(c=>{r[c.label]=TRACKER_BOOL_COLS.some(b=>b.key===c.key)?p[c.key]?"Yes":"No":p[c.key]||"";});return r;});
    const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Tracker");
    XLSX.writeFile(wb,`CLEP_VBSS_Tracker_${todayStamp()}.xlsx`);
  }

  return(
    <div className="page">
      <div className="page-head">
        <div><div className="eyebrow">Shared · syncs across your team</div><h1 className="h1">Attendance & Form Tracker</h1></div>
      </div>
      <div className="card toolbar-card">
        <div className="toolbar-row toolbar-wrap">
          <button className="btn btn-primary" onClick={()=>setAddOpen(v=>!v)}><UserPlus size={14}/> Add panelist</button>
          <button className="btn btn-secondary" onClick={()=>fileRef.current&&fileRef.current.click()}><Upload size={14}/> Import CSV/XLSX</button>
          <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={handleFile} style={{display:"none"}}/>
          <button className="btn btn-secondary" onClick={exportXlsx}><Download size={14}/> Export XLSX</button>
          <div style={{position:"relative"}}>

        onCancel={()=>setReplaceConfirm(null)}/>
      <UndoToast visible={!!pendingUndo} message={pendingUndo?`Removed ${pendingUndo.panelist.name||"panelist"}`:""}
        onUndo={undoRemove}/>
    </div>
  );
}

/* ============================================================ DOCUMENTS & LINKS */
function DocsPage({docs,setDocs,saveDocs,addLog}){
  const [activeCat,setActiveCat]=useState("agenda");
  const [addingLink,setAddingLink]=useState(false);
  const [linkDraft,setLinkDraft]=useState({title:"",url:"",description:"",category:"agenda"});
  const [pendingUndo,setPendingUndo]=useState(null);
  const [pendingUrlDoc,setPendingUrlDoc]=useState(null);
  const [viewingDoc,setViewingDoc]=useState(null);
  const [editingDescId,setEditingDescId]=useState(null);
  const [editingDescVal,setEditingDescVal]=useState("");
  const undoRef=useRef(null);
  useEffect(()=>()=>{if(undoRef.current)clearTimeout(undoRef.current);},[]);

  const catDocs=docs.filter(d=>d.category===activeCat);

  function addLink(){
    if(!linkDraft.title.trim()||!linkDraft.url.trim()) return;
    const url=linkDraft.url.startsWith("http")?linkDraft.url:"https://"+linkDraft.url;
    const newDoc={id:makeId("doc"),type:"link",title:linkDraft.title,url,description:linkDraft.description.trim(),category:linkDraft.category,addedAt:new Date().toISOString()};
    setDocs(prev=>{const n=[newDoc,...prev];if(saveDocs)saveDocs(n);return n;});
    if(addLog) addLog("Link added",`${linkDraft.title} (${DOC_CATEGORIES.find(c=>c.key===linkDraft.category)?.label||linkDraft.category})`);
    setLinkDraft({title:"",url:"",description:"",category:activeCat});
    setAddingLink(false);
  }
  function handleUpload(e){
    const files=Array.from(e.target.files||[]); if(!files.length) return;
    files.forEach(f=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const dataUrl=ev.target.result;
        const newDoc={id:makeId("doc"),type:"file",title:f.name,fileName:f.name,
          fileSize:f.size,fileType:f.type,dataUrl,url:"",description:"",category:activeCat,
          addedAt:new Date().toISOString()};
        setDocs(prev=>{const n=[newDoc,...prev];if(saveDocs)saveDocs(n);return n;});
        if(addLog) addLog("File uploaded",f.name);
      };
      reader.readAsDataURL(f);
    });
    e.target.value="";
  }
  function setDocUrl(id,url){
    setDocs(prev=>prev.map(d=>d.id===id?{...d,url}:d));
    if(url&&addLog) addLog("Document link added",url);
    setPendingUrlDoc(null);
  }
  function removeDoc(id){
    const d=docs.find(x=>x.id===id); if(!d) return;
    if(addLog) addLog("Document removed",`${d.title} (${DOC_CATEGORIES.find(c=>c.key===d.category)?.label||d.category})`);
    setDocs(prev=>{const n=prev.filter(x=>x.id!==id);if(saveDocs)saveDocs(n);return n;});
    if(undoRef.current) clearTimeout(undoRef.current);
    setPendingUndo(d);
    undoRef.current=setTimeout(()=>setPendingUndo(null),8000);
  }
  function undoRemove(){
    if(!pendingUndo) return;
    setDocs(prev=>{const n=[pendingUndo,...prev];if(saveDocs)saveDocs(n);return n;});
    if(undoRef.current) clearTimeout(undoRef.current);
    setPendingUndo(null);
  }

  return(
    <div className="page">
      <div className="page-head">
        <div><div className="eyebrow">Tracking</div><h1 className="h1">Documents & Links</h1></div>
      </div>
      {/* Category tabs */}
      <div className="doc-cat-row">
        {DOC_CATEGORIES.map(c=>(
          <button key={c.key} className={`doc-cat-btn ${activeCat===c.key?"doc-cat-active":""}`}
            onClick={()=>{setActiveCat(c.key);setLinkDraft(d=>({...d,category:c.key}));}}>
            {c.icon} {c.label}
            {docs.filter(d=>d.category===c.key).length>0&&<span className="doc-cat-count">{docs.filter(d=>d.category===c.key).length}</span>}
          </button>
        ))}
      </div>
      {/* Action bar */}
      <div className="card toolbar-card">
        <div className="toolbar-row">
          <button className="btn btn-primary" onClick={()=>setAddingLink(v=>!v)}><Link size={14}/> Add link</button>
          <label className="btn btn-secondary" style={{cursor:"pointer"}}>
            <Upload size={14}/> Upload file
            <input type="file" multiple onChange={handleUpload} style={{display:"none"}}/>
          </label>
        </div>
      </div>
      {/* Add link form */}
      {addingLink&&(
        <div className="card add-form" style={{flexDirection:"column",gap:8}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <input className="input" style={{flex:2,minWidth:160}} placeholder="Title (e.g. Day 1 Agenda v3)" value={linkDraft.title}
              onChange={e=>setLinkDraft(d=>({...d,title:e.target.value}))}/>
            <input className="input" style={{flex:3,minWidth:200}} placeholder="URL (e.g. https://docs.google.com/…)" value={linkDraft.url}
              onChange={e=>setLinkDraft(d=>({...d,url:e.target.value}))}
              onKeyDown={e=>e.key==="Enter"&&addLink()}/>
            <select className="select" value={linkDraft.category} onChange={e=>setLinkDraft(d=>({...d,category:e.target.value}))}>
              {DOC_CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
            </select>
            <button className="btn btn-primary" onClick={addLink}><Plus size={14}/> Add</button>
            <button className="btn btn-ghost" onClick={()=>setAddingLink(false)}><X size={14}/></button>
          </div>
          <input className="input" placeholder="Description (optional — e.g. Final version approved by Ting, Aug 15)" value={linkDraft.description}
            onChange={e=>setLinkDraft(d=>({...d,description:e.target.value}))}/>
        </div>
      )}
      {/* Doc list */}
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        {catDocs.length===0?(
          <EmptyState icon={FileText} title="Nothing here yet"
            body='Add a link or upload a file. It will appear here under this category.'/>
        ):catDocs.map(doc=>(
          <div key={doc.id} className="doc-row" style={{alignItems:"flex-start"}}>
            <div className="doc-icon" style={{marginTop:2}}>{doc.type==="link"?<Link size={16}/>:<FileText size={16}/>}</div>
            <div className="doc-info" style={{flex:1}}>
              <div className="doc-title">
                {doc.type==="link"
                  ?<a href={doc.url} target="_blank" rel="noreferrer">{doc.title}</a>
                  :<span>{doc.title}</span>}
              </div>
              {editingDescId===doc.id?(
                <div style={{display:"flex",gap:6,marginTop:4}}>
                  <input className="input" style={{flex:1,fontSize:"11px",padding:"3px 8px"}} autoFocus
                    value={editingDescVal} onChange={e=>setEditingDescVal(e.target.value)}
                    onKeyDown={e=>{
                      if(e.key==="Enter"){setDocs(prev=>{const n=prev.map(d=>d.id===doc.id?{...d,description:editingDescVal.trim()}:d);if(saveDocs)saveDocs(n);return n;});setEditingDescId(null);}
                      if(e.key==="Escape") setEditingDescId(null);
                    }}/>
                  <button className="btn btn-primary" style={{fontSize:"10px",padding:"2px 8px"}} onClick={()=>{setDocs(prev=>{const n=prev.map(d=>d.id===doc.id?{...d,description:editingDescVal.trim()}:d);if(saveDocs)saveDocs(n);return n;});setEditingDescId(null);}}>Save</button>
                  <button className="btn btn-ghost" style={{fontSize:"10px",padding:"2px 8px"}} onClick={()=>setEditingDescId(null)}>Cancel</button>
                </div>
              ):(
                <div style={{fontSize:"11px",color:"var(--muted)",marginTop:2,lineHeight:1.4,cursor:"pointer",fontStyle:doc.description?"normal":"italic"}}
                  onClick={()=>{setEditingDescId(doc.id);setEditingDescVal(doc.description||"");}}>
                  {doc.description||"Add description…"}
                </div>
              )}
              {doc.type==="link"&&<div className="doc-url" style={{marginTop:3}}>{doc.url}</div>}
              {doc.type==="file"&&(
                <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginTop:3}}>
                  {doc.dataUrl&&<button className="btn btn-secondary" style={{fontSize:"10px",padding:"2px 8px"}} onClick={()=>setViewingDoc(doc)}>👁 View</button>}
                  {doc.dataUrl&&<a className="btn btn-secondary" style={{fontSize:"10px",padding:"2px 8px"}} href={doc.dataUrl} download={doc.fileName}>⬇ Download</a>}
                  {doc.fileSize&&<span className="muted" style={{fontSize:"10px"}}>{(doc.fileSize/1024).toFixed(1)} KB</span>}
                </div>
              )}
            </div>
            <button className="icon-btn" style={{marginTop:2}} onClick={()=>removeDoc(doc.id)}><Trash2 size={14}/></button>
          </div>
        ))}
      </div>
      <UndoToast visible={!!pendingUndo} message={pendingUndo?`Removed "${pendingUndo.title}"`:""}
        onUndo={undoRemove}/>
    </div>
  );
}

/* ============================================================ TASK EDITOR */
function TaskEditor({examName,setExamName,taskTexts,setTaskTexts,taskAssignments,setTaskAssignments,taskDueDates,setTaskDueDates,roles,setRoles,roleNames,setRoleNames,addLog}){
  const [phaseFilter,setPhaseFilter]=useState("ALL");
  const [search,setSearch]=useState("");
  const [editingId,setEditingId]=useState(null);
  const [editVal,setEditVal]=useState("");
  const [newRoleName,setNewRoleName]=useState("");
  const [newRoleAbbr,setNewRoleAbbr]=useState("");
  const [removeRoleTarget,setRemoveRoleTarget]=useState(null);

  const searchNorm=search.trim().toLowerCase();
  const phasesToShow=phaseFilter==="ALL"?PHASES:PHASES.filter(p=>p.key===phaseFilter);

  function startEdit(task){
    setEditingId(task.id);
    setEditVal(taskTexts[task.id]||task.text);
  }
  function saveEdit(taskId){
    setTaskTexts(prev=>({...prev,[taskId]:editVal}));
    if(addLog) addLog("Task text edited",editVal.slice(0,80));
    setEditingId(null);
  }
  function resetText(taskId,originalText){
    setTaskTexts(prev=>{const n={...prev};delete n[taskId];return n;});
    if(addLog) addLog("Task text reset",originalText.slice(0,80));
  }
  function toggleRole(task,roleId){
    setTaskAssignments(prev=>{
      const current=Array.isArray(prev[task.id])&&prev[task.id].length?prev[task.id]:[task.role];
      let next=current.includes(roleId)?current.filter(r=>r!==roleId):[...current,roleId];
      if(!next.length) next=current;
      const copy={...prev};
      if(next.length===1&&next[0]===task.role) delete copy[task.id];
      else copy[task.id]=next;
      return copy;
    });
  }
  function addRole(){
    const name=newRoleName.trim(); if(!name) return;
    const id=slugify(name,roles.map(r=>r.id));
    setRoles(prev=>[...prev,{id,name,abbr:newRoleAbbr.trim(),color:nextColor(prev),removable:true,blurb:""}]);
    if(addLog) addLog("Role added",name);
    setNewRoleName(""); setNewRoleAbbr("");
  }
  function confirmRemoveRole(){
    const id=removeRoleTarget;
    setRoles(prev=>prev.filter(r=>r.id!==id));
    setTaskAssignments(prev=>{
      const n={...prev};
      Object.keys(n).forEach(tid=>{
        if(Array.isArray(n[tid])){ const f=n[tid].filter(r=>r!==id); if(!f.length)delete n[tid]; else n[tid]=f; }
      });
      return n;
    });
    setRemoveRoleTarget(null);
  }

  return(
    <div className="page">
      <div className="page-head"><div><div className="eyebrow">Admin</div><h1 className="h1">Task & Role Editor</h1></div></div>

      <Collapsible title="Team members" defaultOpen={true}>
        <div className="notes-hint" style={{marginBottom:10}}>Enter the name of the person filling each role for this session.</div>
        <div className="role-name-grid">
          {roles.filter(r=>r.id!=="allstaff").map(r=>(
            <div key={r.id} className="role-name-row">
              <RoleBadge role={r}/>
              <input className="input role-name-input" placeholder={`e.g. ${r.id==="pm"?"Len Carmichael":r.id==="psych"?"Ting Zhang":r.id==="pf"?"Yuan Ge":r.id==="cf"?"Andrew Roibal":r.id==="dqa"?"Amanda Faille":r.id==="rs"?"Christopher Jones":r.id==="program"?"Huanwei Zhao":"Name"}`}
                value={roleNames[r.id]||""}
                onChange={e=>{
                  setRoleNames(prev=>({...prev,[r.id]:e.target.value}));
                  clearTimeout(window[`__rnTimer_${r.id}`]);
                  if(e.target.value.trim()&&addLog) window[`__rnTimer_${r.id}`]=setTimeout(()=>addLog("Team member set",`${r.name}: ${e.target.value.trim()}`),1500);
                }}/>
            </div>
          ))}
        </div>
      </Collapsible>

      <Collapsible title="Roles" defaultOpen={false}>
        <div className="role-chips">
          {roles.map(r=>(
            <div key={r.id} className="role-chip">
              <RoleBadge role={r}/>
              <span className="role-chip-blurb">{r.blurb}</span>
              {r.removable&&<button className="icon-btn" onClick={()=>setRemoveRoleTarget(r.id)}><Trash2 size={13}/></button>}
            </div>
          ))}
        </div>
        <div className="toolbar-row" style={{marginTop:12}}>
          <input className="input" placeholder="New role name" value={newRoleName} onChange={e=>setNewRoleName(e.target.value)}/>
          <input className="input" style={{maxWidth:130}} placeholder="Abbreviation" value={newRoleAbbr} onChange={e=>setNewRoleAbbr(e.target.value)}/>
          <button className="btn btn-primary" onClick={addRole}><Plus size={14}/> Add role</button>
        </div>
      </Collapsible>

      <Collapsible title="Edit task text & assignments" defaultOpen={true}>
        <div className="toolbar-row" style={{marginBottom:12}}>
          <select className="select" value={phaseFilter} onChange={e=>setPhaseFilter(e.target.value)}>
            <option value="ALL">All phases</option>
            {PHASES.map(p=><option key={p.key} value={p.key}>{p.short}</option>)}
          </select>
          <div className="search-wrap" style={{flex:1}}>
            <Search size={13}/><input className="search-input" placeholder="Search tasks…" value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
        </div>
        {phasesToShow.map(phase=>{
          const tasks=DEFAULT_TASKS[phase.key].filter(t=>!searchNorm||t.text.toLowerCase().includes(searchNorm));
          if(!tasks.length) return null;
          return(
            <Collapsible key={phase.key} title={phase.label} defaultOpen={false}
              badge={`${tasks.length} tasks`}>
              {tasks.map(task=>{
                const sel=effectiveRoles(task,taskAssignments);
                const overText=!!taskTexts[task.id];
                const isEditing=editingId===task.id;
                return(
                  <div key={task.id} className="admin-task-row">
                    <div className="admin-task-left">
                      {isEditing?(
                        <div style={{display:"flex",gap:6,flex:1}}>
                          <input className="input" style={{flex:1}} value={editVal} onChange={e=>setEditVal(e.target.value)}
                            onKeyDown={e=>e.key==="Enter"&&saveEdit(task.id)}/>
                          <button className="btn btn-primary" onClick={()=>saveEdit(task.id)}><Check size={13}/></button>
                          <button className="btn btn-ghost" onClick={()=>setEditingId(null)}><X size={13}/></button>
                        </div>
                      ):(
                        <div style={{display:"flex",alignItems:"center",gap:8,flex:1}}>
                          <span className="admin-task-txt">{resolveTaskText(task,taskTexts,examName)}</span>
                          <button className="icon-btn" onClick={()=>startEdit(task)} title="Edit text"><Pencil size={13}/></button>
                          {overText&&<button className="icon-btn" onClick={()=>resetText(task.id,task.text)} title="Reset to default"><RotateCcw size={13}/></button>}
                        </div>
                      )}
                    </div>
                    <div className="admin-role-pick">
                      {roles.map(r=>(
                        <button key={r.id} className={`rf-chip rf-chip-sm ${sel.includes(r.id)?"rf-active":""}`}
                          style={sel.includes(r.id)?{background:`${r.color}22`,color:r.color,borderColor:`${r.color}55`}:{}}
                          onClick={()=>toggleRole(task,r.id)}>
                          {r.abbr&&r.abbr.trim()?r.abbr:r.name}
                        </button>
                      ))}
                      {taskAssignments[task.id]&&<button className="icon-btn" title="Reset" onClick={()=>setTaskAssignments(p=>{const n={...p};delete n[task.id];return n;})}><RotateCcw size={12}/></button>}
                    </div>
                  </div>
                );
              })}
            </Collapsible>
          );
        })}
      </Collapsible>

      <Confirm open={!!removeRoleTarget} title="Remove this role?" danger
        body="Tasks assigned to this role will revert to their default owner."
        confirmLabel="Remove" onConfirm={confirmRemoveRole} onCancel={()=>setRemoveRoleTarget(null)}/>
      {/* File viewer modal */}
      {viewingDoc&&(
        <div className="modal-overlay" onClick={()=>setViewingDoc(null)}>
          <div className="modal-box" style={{maxWidth:860,width:"95vw",maxHeight:"90vh",display:"flex",flexDirection:"column",padding:0,overflow:"hidden"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",borderBottom:"1px solid var(--border)"}}>
              <span style={{fontWeight:600,fontSize:"13px",color:"var(--navy)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{viewingDoc.title}</span>
              <div style={{display:"flex",gap:8,flexShrink:0}}>
                <a className="btn btn-secondary" style={{fontSize:"11px"}} href={viewingDoc.dataUrl} download={viewingDoc.fileName}>⬇ Download</a>
                <button className="btn btn-ghost" style={{fontSize:"11px"}} onClick={()=>setViewingDoc(null)}>✕ Close</button>
              </div>
            </div>
            <div style={{flex:1,overflow:"auto",background:"#F7F5FB",display:"flex",alignItems:"center",justifyContent:"center",minHeight:300}}>
              {viewingDoc.fileType&&viewingDoc.fileType.startsWith("image/")?(
                <img src={viewingDoc.dataUrl} alt={viewingDoc.title} style={{maxWidth:"100%",maxHeight:"70vh",objectFit:"contain"}}/>
              ):viewingDoc.fileType==="application/pdf"?(
                <iframe src={viewingDoc.dataUrl} style={{width:"100%",height:"70vh",border:"none"}} title={viewingDoc.title}/>
              ):(
                <div style={{textAlign:"center",padding:40}}>
                  <div style={{fontSize:48,marginBottom:12}}>📄</div>
                  <div style={{fontSize:"13px",color:"var(--muted)",marginBottom:16}}>{viewingDoc.fileName}</div>
                  <a className="btn btn-primary" href={viewingDoc.dataUrl} download={viewingDoc.fileName}>⬇ Download file</a>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================ RACI MATRIX (editable) */
const RACI_OPTIONS=["R","A","C","I",null];
function RaciMatrix({raciData,setRaciData,roles,addLog}){
  const [highlight,setHighlight]=useState(null);
  const [editingCell,setEditingCell]=useState(null);
  const [addingRow,setAddingRow]=useState(false);
  const [newCat,setNewCat]=useState("");
  const displayRoles=RACI_ROLE_ORDER.map(id=>getRole(roles,id)).filter(Boolean);
  const letterLabel={R:"Responsible",A:"Accountable",C:"Consulted",I:"Informed"};
  const colors={R:"#2F9E44",A:"#3E63DD",C:"#E8590C",I:"#9333EA"};

  function cycleCell(rowId,roleId){
    setRaciData(prev=>prev.map(row=>{
      if(row.id!==rowId) return row;
      const cur=row.raci[roleId]||null;
      const next=RACI_OPTIONS[(RACI_OPTIONS.indexOf(cur)+1)%RACI_OPTIONS.length];
      const roleObj=getRole(roles,roleId);
      if(addLog) addLog("RACI cell updated",`${row.category} — ${roleObj?.name||roleId}: ${cur||"—"} → ${next||"—"}`);
      return{...row,raci:{...row.raci,[roleId]:next}};
    }));
  }
  function addRow(){
    if(!newCat.trim()) return;
    const id=makeId("raci");
    const raci={};
    RACI_ROLE_ORDER.forEach(r=>raci[r]=null);
    setRaciData(prev=>[...prev,{id,category:newCat.trim(),raci}]);
    if(addLog) addLog("RACI row added",newCat.trim());
    setNewCat(""); setAddingRow(false);
  }
  function removeRow(id){
    const row=raciData.find(r=>r.id===id);
    if(addLog&&row) addLog("RACI row removed",row.category);
    setRaciData(prev=>prev.filter(r=>r.id!==id));
  }
  function updateCategory(id,val){
    setRaciData(prev=>prev.map(r=>r.id===id?{...r,category:val}:r));
    if(addLog&&val.trim()) addLog("RACI category renamed",val.trim());
  }

  return(
    <div className="page">
      <div className="page-head"><div><div className="eyebrow">Reference</div><h1 className="h1">RACI Matrix</h1></div></div>

      <div className="card raci-legend">
        {Object.keys(letterLabel).map(k=>(
          <div key={k} className="raci-legend-item" style={{borderLeft:`3px solid ${colors[k]}`}}>
            <strong style={{color:colors[k]}}>{k}</strong> {letterLabel[k]}
          </div>
        ))}
        <span className="muted" style={{marginLeft:"auto"}}>Click a cell to cycle R→A→C→I→blank. Click header to highlight column.</span>
      </div>

      <div className="card tbl-card">
        <div className="tbl-scroll">
          <table className="tbl raci-tbl">
            <thead><tr>
              <th style={{minWidth:200}}>Task Category</th>
              {displayRoles.map(r=>(
                <th key={r.id} className={`tc raci-th ${highlight===r.id?"raci-th-hl":""}`}
                  onClick={()=>setHighlight(highlight===r.id?null:r.id)} style={{cursor:"pointer",minWidth:80}}>
                  <RoleBadge role={r} size="sm"/>
                </th>
              ))}
              <th className="tc" style={{minWidth:48}}>Del</th>
            </tr></thead>
            <tbody>
              {raciData.map(row=>(
                <tr key={row.id} className={highlight&&row.raci[highlight]?"raci-row-hl":""}>
                  <td>
                    <input className="cell-input" value={row.category}
                      onChange={e=>updateCategory(row.id,e.target.value)} style={{minWidth:180}}/>
                  </td>
                  {displayRoles.map(r=>{
                    const val=row.raci[r.id]||null;
                    return(
                      <td key={r.id} className={`tc ${highlight===r.id?"raci-td-hl":""}`}>
                        <button className="raci-cell-btn" style={val?{background:`${colors[val]}18`,color:colors[val],borderColor:`${colors[val]}44`}:{}}
                          onClick={()=>cycleCell(row.id,r.id)} title="Click to cycle">
                          {val||<span className="muted">–</span>}
                        </button>
                      </td>
                    );
                  })}
                  <td className="tc">
                    <button className="icon-btn" onClick={()=>removeRow(row.id)}><Trash2 size={13}/></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {addingRow?(
        <div className="card add-form">
          <input className="input" placeholder="New task category name" value={newCat} onChange={e=>setNewCat(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addRow()}/>
          <button className="btn btn-primary" onClick={addRow}><Plus size={14}/> Add row</button>
          <button className="btn btn-ghost" onClick={()=>setAddingRow(false)}><X size={14}/></button>
        </div>
      ):(
        <button className="btn btn-secondary" onClick={()=>setAddingRow(true)}><Plus size={14}/> Add category row</button>
      )}
    </div>
  );
}

/* ============================================================ GLOSSARY */
function Glossary({glossaryTerms,setGlossaryTerms,addLog}){
  const [adding,setAdding]=useState(false);
  const [draft,setDraft]=useState({term:"",def:""});
  const [editId,setEditId]=useState(null);
  const [editDraft,setEditDraft]=useState({term:"",def:""});

  const sorted=[...(glossaryTerms||[])].sort((a,b)=>a.term.localeCompare(b.term));

  function addTerm(){
    if(!draft.term.trim()||!draft.def.trim()) return;
    setGlossaryTerms(prev=>[...prev,{id:makeId("g"),term:draft.term.trim(),def:draft.def.trim()}]);
    if(addLog) addLog("Glossary term added",draft.term.trim());
    setDraft({term:"",def:""});
    setAdding(false);
  }
  function startEdit(t){setEditId(t.id);setEditDraft({term:t.term,def:t.def});}
  function saveEdit(){
    if(!editDraft.term.trim()||!editDraft.def.trim()) return;
    setGlossaryTerms(prev=>prev.map(t=>t.id===editId?{...t,term:editDraft.term.trim(),def:editDraft.def.trim()}:t));
    if(addLog) addLog("Glossary term edited",editDraft.term.trim());
    setEditId(null);
  }
  function removeTerm(id){
    const t=glossaryTerms.find(x=>x.id===id);
    if(addLog&&t) addLog("Glossary term removed",t.term);
    setGlossaryTerms(prev=>prev.filter(x=>x.id!==id));
  }

  return(
    <div className="page">
      <div className="page-head">
        <div><div className="eyebrow">Reference</div><h1 className="h1">Glossary</h1></div>
        <button className="btn btn-primary" onClick={()=>setAdding(v=>!v)}><Plus size={14}/> Add term</button>
      </div>

      {adding&&(
        <div className="card add-form" style={{flexDirection:"column",alignItems:"stretch",gap:8}}>
          <div className="toolbar-row">
            <input className="input" style={{maxWidth:220}} placeholder="Term (e.g. RACI)" value={draft.term}
              onChange={e=>setDraft(d=>({...d,term:e.target.value}))}/>
            <input className="input" placeholder="Definition" value={draft.def}
              onChange={e=>setDraft(d=>({...d,def:e.target.value}))}
              onKeyDown={e=>e.key==="Enter"&&addTerm()}/>
            <button className="btn btn-primary" onClick={addTerm}><Check size={14}/> Save</button>
            <button className="btn btn-ghost" onClick={()=>{setAdding(false);setDraft({term:"",def:""});}}><X size={14}/></button>
          </div>
        </div>
      )}

      <div className="card">
        {sorted.length===0&&<EmptyState icon={BookOpen} title="No glossary terms yet" body="Click 'Add term' to get started."/>}
        <dl className="glossary">
          {sorted.map(e=>(
            <div key={e.id} className="glossary-row">
              {editId===e.id?(
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-start"}}>
                  <input className="input" style={{maxWidth:200}} value={editDraft.term}
                    onChange={ev=>setEditDraft(d=>({...d,term:ev.target.value}))}/>
                  <input className="input" style={{flex:1,minWidth:200}} value={editDraft.def}
                    onChange={ev=>setEditDraft(d=>({...d,def:ev.target.value}))}
                    onKeyDown={ev=>ev.key==="Enter"&&saveEdit()}/>
                  <button className="btn btn-primary" onClick={saveEdit}><Check size={13}/></button>
                  <button className="btn btn-ghost" onClick={()=>setEditId(null)}><X size={13}/></button>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                  <div style={{flex:1}}>
                    <dt>{e.term}</dt>
                    <dd>{e.def}</dd>
                  </div>
                  <button className="icon-btn" onClick={()=>startEdit(e)} title="Edit"><Pencil size={13}/></button>
                  <button className="icon-btn" onClick={()=>removeTerm(e.id)} title="Delete"><Trash2 size={13}/></button>
                </div>
              )}
            </div>
          ))}
        </dl>
      </div>
    </div>
  );
}

/* ============================================================ SETTINGS */
function SettingsPage({examName,setExamName,examNameNote,setExamNameNote,sessionDates,setSessionDates,onExportData,onClearData,addLog}){
  const [clearConfirm,setClearConfirm]=useState(false);
  const [generating,setGenerating]=useState(false);
  function setDate(key,val){
    setSessionDates(prev=>({...prev,[key]:val}));
    const labels={kickoff:"Kickoff Meeting",dryrun:"Dry Run Meeting",day1:"Day 1",day2:"Day 2",day3:"Day 3",gradesetting:"Grade Setting Meeting",retro:"Retro Meeting"};
    if(addLog&&val) addLog("Session date set",`${labels[key]||key} → ${val}`);
  }

  const dateFields=[
    {key:"kickoff",  label:"Kickoff Meeting",                hint:"Staff dry run of Day 1 & 2"},
    {key:"dryrun",   label:"Dry Run Meeting",                hint:"Staff dry run of Day 3"},
    {key:"day1",     label:"Day 1 — VBSS",                   hint:"Orientation & Test Preview"},
    {key:"day2",     label:"Day 2 — VBSS",                   hint:"TSD Development & Round 1 Ratings"},
    {key:"day3",     label:"Day 3 — VBSS",                   hint:"Round 2 & 3 Ratings & Adjournment"},
    {key:"gradesetting", label:"Grade Setting Meeting",       hint:"Grade setting meeting with committee"},
    {key:"retro",        label:"Retrospective Meeting",         hint:"Post-VBSS team retrospective"},
  ];

  return(
    <div className="page">
      <div className="page-head"><div><div className="eyebrow">Admin</div><h1 className="h1">Settings</h1></div></div>

      <div className="card">
        <div className="section-title" style={{marginTop:0}}>Exam name</div>
        <div className="toolbar-row" style={{flexWrap:"wrap",gap:10}}>
          <input className="input" style={{maxWidth:320}} placeholder="e.g. CLEP Biology"
            value={examName} onChange={e=>{setExamName(e.target.value);clearTimeout(window.__examNameTimer);if(e.target.value.trim())window.__examNameTimer=setTimeout(()=>{if(addLog)addLog("Exam name updated",e.target.value.trim());},1500);}}/>
        </div>
        <div className="notes-hint" style={{marginTop:6}}>Replaces <code>{"{EXAM}"}</code> in task names throughout the app.</div>
        <div style={{marginTop:14}}>
          <textarea className="notes-ta" rows={2} placeholder="Optional note about this session's exam…"
            value={examNameNote||""} onChange={e=>setExamNameNote(e.target.value)}/>
        </div>
      </div>

      <div className="card">
        <div className="section-title" style={{marginTop:0}}>Session dates</div>
        <div className="notes-hint" style={{marginBottom:14}}>Dates appear on the Dashboard and Process Flow page. Set them here once your schedule is confirmed.</div>
        <div className="settings-dates-grid">
          {dateFields.map(f=>(
            <div key={f.key} className="settings-date-row">
              <div className="settings-date-label">
                <span>{f.label}</span>
                <span className="muted" style={{fontSize:"11px"}}>{f.hint}</span>
              </div>
              <input type="date" className="date-input settings-date-input"
                value={(sessionDates&&sessionDates[f.key])||""}
                onChange={e=>setDate(f.key,e.target.value)}/>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="section-title" style={{marginTop:0}}>App data</div>
        <div className="notes-hint" style={{marginBottom:14}}>Use these tools at the end of each standard setting session to archive a record and reset the app for the next one.</div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div className="settings-action-row">
            <div>
              <div className="settings-action-title">Export App Data</div>
              <div className="settings-action-hint">Downloads a complete JSON record of all tasks, panelists, dates, notes, RACI, and change log. Save it as your session archive.</div>
            </div>
            <button className="btn btn-primary" disabled={generating} onClick={()=>{setGenerating(true);onExportData();setTimeout(()=>setGenerating(false),1000);}}>
              <Download size={14}/> {generating?"Downloading…":"Export App Data"}
            </button>
          </div>
          <div className="settings-action-divider"/>
          <div className="settings-action-row">
            <div>
              <div className="settings-action-title" style={{color:"var(--danger)"}}>Clear App Data</div>
              <div className="settings-action-hint">Resets all shared data so the app is ready for a new session. <strong>This cannot be undone.</strong> Export first.</div>
            </div>
            {!clearConfirm
              ?<button className="btn btn-danger" onClick={()=>setClearConfirm(true)}><Trash2 size={14}/> Clear App Data</button>
              :<div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span className="muted" style={{fontSize:"12px"}}>Are you sure?</span>
                <button className="btn btn-danger" onClick={()=>{onClearData();setClearConfirm(false);}}>Yes, clear everything</button>
                <button className="btn btn-ghost" onClick={()=>setClearConfirm(false)}>Cancel</button>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================ USER NAME PROMPT */
const PRESET_EMOJIS=["🦊","🐼","🐨","🐸","🦁","🐯","🦋","🐙","🦩","🦚","🦜","🐢","🦔","🦦","🐺","🦝","🐻","🐮","🦄","🐧","🦈","🦭","🐿️","🦎"];

function AvatarDisplay({avatar,size=28}){
  if(!avatar) return <span style={{fontSize:size*0.85+"px"}}>👤</span>;
  if(avatar.startsWith("data:")) return <img src={avatar} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover"}} alt="avatar"/>;
  return <span style={{fontSize:size*0.85+"px"}}>{avatar}</span>;
}

function UserNamePrompt({onSave,initialName="",initialAvatar=""}){
  const [val,setVal]=useState(initialName);
  const [avatar,setAvatar]=useState(initialAvatar);
  const [tab,setTab]=useState("emoji"); // "emoji" | "upload"
  const fileRef=useRef(null);

  function handleUpload(e){
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    if(!file.type.startsWith("image/")) return;
    const reader=new FileReader();
    reader.onload=()=>setAvatar(reader.result);
    reader.readAsDataURL(file);
  }

  return(
    <div className="modal-overlay">
      <div className="modal-box profile-modal" onClick={e=>e.stopPropagation()}>
        <h3 className="modal-title">Your Profile</h3>
        <p className="modal-body" style={{marginBottom:16}}>Set your name and avatar. This is saved to your browser only.</p>

        {/* Avatar preview */}
        <div className="profile-preview">
          <div className="profile-avatar-lg"><AvatarDisplay avatar={avatar} size={56}/></div>
          <div className="profile-tabs">
            <button className={`profile-tab ${tab==="emoji"?"profile-tab-active":""}`} onClick={()=>setTab("emoji")}>Emoji</button>
            <button className={`profile-tab ${tab==="upload"?"profile-tab-active":""}`} onClick={()=>setTab("upload")}>Upload photo</button>
          </div>
        </div>

        {tab==="emoji"&&(
          <div className="emoji-grid">
            {PRESET_EMOJIS.map(e=>(
              <button key={e} className={`emoji-btn ${avatar===e?"emoji-btn-active":""}`}
                onClick={()=>setAvatar(avatar===e?"":e)}>{e}</button>
            ))}
          </div>
        )}
        {tab==="upload"&&(
          <div style={{textAlign:"center",padding:"12px 0"}}>
            <input ref={fileRef} type="file" accept="image/*" onChange={handleUpload} style={{display:"none"}}/>
            <button className="btn btn-secondary" onClick={()=>fileRef.current&&fileRef.current.click()}>
              <Upload size={14}/> Choose image
            </button>
            {avatar&&avatar.startsWith("data:")&&(
              <button className="btn btn-ghost" style={{marginLeft:8}} onClick={()=>setAvatar("")}>Remove</button>
            )}
          </div>
        )}

        {/* Name input */}
        <input className="input" style={{width:"100%",margin:"14px 0 16px"}}
          placeholder="Your name (e.g. Yuan Ge)"
          value={val} onChange={e=>setVal(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&val.trim()&&onSave(val.trim(),avatar)}
          autoFocus/>

        <div className="modal-actions">
          <button className="btn btn-primary" style={{width:"100%"}} disabled={!val.trim()} onClick={()=>val.trim()&&onSave(val.trim(),avatar)}>Save profile</button>
        </div>
      </div>
    </div>
  );
}
