function ChangeLog({changelog,setChangelog,examName}){
  const [filter,setFilter]=useState("");
  const [confirmClear,setConfirmClear]=useState(false);
  const norm=filter.trim().toLowerCase();

  const filtered=changelog.filter(e=>
    !norm||(e.action+e.detail).toLowerCase().includes(norm)
  );

  function fmt(ts){
    try{
      const d=new Date(ts);
      return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+" "+
             d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
    }catch(e){return ts;}
  }

  const ACTION_COLORS={
    "Task completed":"#2F9E44","Task unchecked":"#9CA3AF","Notes updated":"#3E63DD",
    "Due date set":"#7C3AED","Panelist added":"#2F9E44","Panelist removed":"#B3382C",
    "Link added":"#0D7490","File(s) uploaded":"#0D7490","App data exported":"#0D7490",
    "App data cleared":"#B3382C","Session date set":"#7C3AED",
  };

  function exportLog(){
    const lines=["CLEP VBSS Change Log","Exam: "+(examName||"CLEP"),"Exported: "+new Date().toLocaleString(),"","Timestamp,Action,Detail"];
    changelog.forEach(e=>lines.push(`"${fmt(e.ts)}","${e.action}","${e.detail}"`));
    const csv=lines.join("\n");
    const encoded="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    const a=document.createElement("a");
    a.href=encoded; a.download=`CLEP_VBSS_ChangeLog_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function clearLog(){
    setChangelog([]);
    storageSet(CHANGELOG_KEY,JSON.stringify([]),true);
    setConfirmClear(false);
  }

  return(
    <div className="page">
      <div className="page-head">
        <div><div className="eyebrow">Tracking</div><h1 className="h1">Change Log</h1></div>
        <div style={{display:"flex",gap:8}}>
{!confirmClear
            ?<button className="btn btn-ghost" onClick={()=>setConfirmClear(true)}><Trash2 size={13}/> Clear log</button>
            :<><button className="btn btn-danger" onClick={clearLog}>Confirm clear</button>
               <button className="btn btn-ghost" onClick={()=>setConfirmClear(false)}>Cancel</button></>
          }
        </div>
      </div>

      <div className="card toolbar-card">
        <div className="search-wrap">
          <Search size={13}/>
          <input className="search-input" placeholder="Filter by action or detail…"
            value={filter} onChange={e=>setFilter(e.target.value)}/>
        </div>
        <span className="muted">{filtered.length} entr{filtered.length===1?"y":"ies"}{filter?" matching":""}
          {changelog.length>0&&!filter?` · ${changelog.length} total`:""}</span>
      </div>

      {filtered.length===0?(
        <div className="card">
          <EmptyState icon={Circle} title="No changes recorded yet"
            body="Actions like completing tasks, setting dates, adding panelists, and uploading documents will appear here automatically."/>
        </div>
      ):(
        <div className="card changelog-card">
          {filtered.map((entry,i)=>{
            const color=ACTION_COLORS[entry.action]||"#64748B";
            const isLast=i===filtered.length-1;
            return(
              <div key={entry.id} className={`cl-row ${isLast?"cl-row-last":""}`}>
                <div className="cl-spine">
                  <div className="cl-dot" style={{background:color}}/>
                  {!isLast&&<div className="cl-line"/>}
                </div>
                <div className="cl-body">
                  <div className="cl-action-row">
                    <span className="cl-action" style={{color}}>{entry.action}</span>
                    <span className="cl-ts">{fmt(entry.ts)}</span>
                  </div>
                  <div className="cl-detail">{entry.detail}</div>
                  {entry.user&&<div className="cl-user">— {entry.user}</div>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================ MAIN APP */
function App(){
  const [page,setPage]=useState("dashboard");
  const [ready,setReady]=useState(false);
  const [saveStatus,setSaveStatus]=useState("saved");

  // personal (per-user)
  const initP=defaultPersonal();
  const [completed,setCompleted]=useState(()=>{const c={};PHASES.forEach(p=>{c[p.key]={};});return c;});
  const [notes,setNotes]=useState(initP.notes);
  const [trackerColumns,setTrackerColumns]=useState(()=>Object.fromEntries(ALL_TRACKER_COLS.map(c=>[c.key,true])));
  const [taskNotes,setTaskNotes]=useState({});
  const [globalRoleFilter,setGlobalRoleFilter]=useState([]);
  const [roleNames,setRoleNames]=useState({});
  const [changelog,setChangelog]=useState([]);
  const [docxReady,setDocxReady]=useState(()=>!!window.docx);
  useEffect(()=>{
    if(window.docx){setDocxReady(true);return;}
    // Preload as high-priority resource
    const link=document.createElement("link");
    link.rel="preload"; link.as="script";
    link.href="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js";
    document.head.appendChild(link);
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js";
    s.async=true;
    s.onload=()=>setDocxReady(true);
    document.head.appendChild(s);
  },[]);
  const [userName,setUserName]=useState("");
  const [userAvatar,setUserAvatar]=useState("");
  const userNameRef=useRef("");
  const [showNamePrompt,setShowNamePrompt]=useState(false);

  // shared (all users)
  const [panelists,setPanelists]=useState([]);
  const [roles,setRoles]=useState(()=>DEFAULT_ROLES.map(r=>({...r})));
  const [taskAssignments,setTaskAssignments]=useState({});
  const [taskTexts,setTaskTexts]=useState({});
  const [taskDueDates,setTaskDueDates]=useState({});
  const [raciData,setRaciData]=useState(DEFAULT_RACI.map(r=>({...r,raci:{...r.raci}})));
  const [examName,setExamName]=useState("CLEP");
  const [examNameNote,setExamNameNote]=useState("");
  const [docs,setDocs]=useState([]);
  const [sessionDates,setSessionDates]=useState({kickoff:"",dryrun:"",day1:"",day2:"",day3:"",gradesetting:"",retro:""});
  const [glossaryTerms,setGlossaryTerms]=useState(()=>DEFAULT_GLOSSARY_TERMS.map(t=>({...t})));

  const lastPersonalRef=useRef(null);
  const lastSharedRef=useRef(null);


  // Load
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const pDef=defaultPersonal();
      const pRaw=await storageGet(PERSONAL_KEY,false);
      const pParsed=safeParse(pRaw,pDef);
      const mNotes={...pDef.notes,...(pParsed.notes||{})};
      // trackerColumns and taskNotes now loaded from shared storage

      let sRaw=await storageGet(SHARED_KEY,true);
      let sParsed=safeParse(sRaw,null);
      if(!sParsed){ sParsed=defaultShared(); await storageSet(SHARED_KEY,JSON.stringify(sParsed),true); }

      const rawRoles=Array.isArray(sParsed.roles)&&sParsed.roles.length?sParsed.roles:DEFAULT_ROLES.map(r=>({...r}));
      // Always apply current abbrs from DEFAULT_ROLES for built-in roles (fixes stale storage)
      const defaultAbbrMap=Object.fromEntries(DEFAULT_ROLES.map(r=>[r.id,r.abbr]));
      const mRoles=rawRoles.map(r=>defaultAbbrMap[r.id]!==undefined?{...r,abbr:defaultAbbrMap[r.id]}:r);
      const cRaw=await storageGet(COMPLETED_KEY,true);
      const mComp=safeParse(cRaw,null)&&typeof safeParse(cRaw,null)==="object"?safeParse(cRaw,null):(()=>{const c={};PHASES.forEach(p=>{c[p.key]={};});return c;})();
      const panRaw=await storageGet(PANELISTS_KEY,true);
      const mPan=Array.isArray(safeParse(panRaw,null))?safeParse(panRaw,[]):[];
      const datesRaw=await storageGet(DATES_KEY,true);
      const mDates=safeParse(datesRaw,null)&&typeof safeParse(datesRaw,null)==="object"?safeParse(datesRaw,null):{kickoff:"",dryrun:"",day1:"",day2:"",day3:"",gradesetting:"",retro:""};
      const docsRaw=await storageGet(DOCS_KEY,true);
      const mDocs2=Array.isArray(safeParse(docsRaw,null))?safeParse(docsRaw,[]):[];
      const mAsgn=sParsed.taskAssignments&&typeof sParsed.taskAssignments==="object"?sParsed.taskAssignments:{};
      const mTxt=sParsed.taskTexts&&typeof sParsed.taskTexts==="object"?sParsed.taskTexts:{};
      const mDue=sParsed.taskDueDates&&typeof sParsed.taskDueDates==="object"?sParsed.taskDueDates:{};
      const mTaskNotes=sParsed.taskNotes&&typeof sParsed.taskNotes==="object"?sParsed.taskNotes:{};
      const mCols=sParsed.trackerColumns&&typeof sParsed.trackerColumns==="object"?sParsed.trackerColumns:Object.fromEntries(ALL_TRACKER_COLS.map(c=>[c.key,true]));
      const mRaci=Array.isArray(sParsed.raciData)&&sParsed.raciData.length?sParsed.raciData:DEFAULT_RACI.map(r=>({...r,raci:{...r.raci}}));
      const mExam=typeof sParsed.examName==="string"&&sParsed.examName?sParsed.examName:"CLEP";
      const mNote=typeof sParsed.examNameNote==="string"?sParsed.examNameNote:"";
      const mDocs=Array.isArray(sParsed.docs)?sParsed.docs:[];
      const mRoleNames=sParsed.roleNames&&typeof sParsed.roleNames==="object"?sParsed.roleNames:{};
      const clRaw=await storageGet(CHANGELOG_KEY,true);
      const mChangelog=Array.isArray(safeParse(clRaw,null))?safeParse(clRaw,[]):[];
      // Merge stored terms with any new DEFAULT_GLOSSARY_TERMS not yet in storage
const storedGloss=Array.isArray(sParsed.glossaryTerms)&&sParsed.glossaryTerms.length?sParsed.glossaryTerms:[];
const storedIds=new Set(storedGloss.map(t=>t.id));
const missingTerms=DEFAULT_GLOSSARY_TERMS.filter(t=>!storedIds.has(t.id));
const mGloss=storedGloss.length?[...storedGloss,...missingTerms]:DEFAULT_GLOSSARY_TERMS.map(t=>({...t}));

      if(cancelled) return;
      setNotes(mNotes);
      setCompleted(mComp); setTrackerColumns(mCols); setTaskNotes(mTaskNotes);
      setPanelists(mPan); setRoles(mRoles); setTaskAssignments(mAsgn); setTaskTexts(mTxt);
      setTaskDueDates(mDue); setRaciData(mRaci); setExamName(mExam); setExamNameNote(mNote); setDocs(mDocs2);
      setRoleNames(mRoleNames); setSessionDates(mDates); setGlossaryTerms(mGloss); setChangelog(mChangelog);
      // Load user name from personal storage
      const uRaw=await storageGet(USER_KEY,false);
      const uName=typeof uRaw==="string"&&uRaw.trim()?uRaw.trim():"";
      const aRaw=await storageGet(AVATAR_KEY,false);
      const uAvatar=typeof aRaw==="string"?aRaw:"";
      if(cancelled) return;
      setUserName(uName);
      setUserAvatar(uAvatar);
      if(!uName) setShowNamePrompt(true);
      lastPersonalRef.current=JSON.stringify({notes:mNotes});
      lastSharedRef.current=JSON.stringify({roles:mRoles,taskAssignments:mAsgn,taskTexts:mTxt,taskDueDates:mDue,taskNotes:mTaskNotes,trackerColumns:mCols,raciData:mRaci,examName:mExam,examNameNote:mNote,glossaryTerms:mGloss,roleNames:mRoleNames});
      setReady(true);
    })();
    return()=>{cancelled=true;};
  },[]);

  // Poll docs on dedicated key
  useEffect(()=>{
    const iv=setInterval(async()=>{
      const raw=await storageGet(DOCS_KEY,true);
      if(!raw||raw===lastDocsRef.current) return;
      const parsed=safeParse(raw,null);
      if(Array.isArray(parsed)){lastDocsRef.current=raw; setDocs(parsed);}
    },2000);
    return()=>clearInterval(iv);
  },[]);

  // Poll shared
  useEffect(()=>{
    const iv=setInterval(async()=>{
      const raw=await storageGet(SHARED_KEY,true);
      if(!raw||raw===lastSharedRef.current) return;
      const p=safeParse(raw,null); if(!p) return;
      lastSharedRef.current=raw;
      const polledRoles=Array.isArray(p.roles)&&p.roles.length?p.roles:DEFAULT_ROLES.map(r=>({...r}));
      const defAbbrMap=Object.fromEntries(DEFAULT_ROLES.map(r=>[r.id,r.abbr]));
      setRoles(polledRoles.map(r=>defAbbrMap[r.id]!==undefined?{...r,abbr:defAbbrMap[r.id]}:r));
      setTaskAssignments(p.taskAssignments&&typeof p.taskAssignments==="object"?p.taskAssignments:{});
      setTaskTexts(p.taskTexts&&typeof p.taskTexts==="object"?p.taskTexts:{});
      setTaskDueDates(p.taskDueDates&&typeof p.taskDueDates==="object"?p.taskDueDates:{});
      if(p.taskNotes&&typeof p.taskNotes==="object") setTaskNotes(p.taskNotes);
      if(p.trackerColumns&&typeof p.trackerColumns==="object") setTrackerColumns(p.trackerColumns);
      if(Array.isArray(p.raciData)&&p.raciData.length) setRaciData(p.raciData);
      if(typeof p.examName==="string"&&p.examName) setExamName(p.examName);
      if(typeof p.examNameNote==="string") setExamNameNote(p.examNameNote);
      if(p.roleNames&&typeof p.roleNames==="object") setRoleNames(p.roleNames);
      const clRawPoll=await storageGet(CHANGELOG_KEY,true);
      const clParsed=safeParse(clRawPoll,null);
      if(Array.isArray(clParsed)) setChangelog(clParsed);
      if(Array.isArray(p.glossaryTerms)&&p.glossaryTerms.length) setGlossaryTerms(p.glossaryTerms);
    },4000);
    return()=>clearInterval(iv);
  },[]);

  // Poll completed separately on its own key — no debounce interference
  const lastCompletedRef=useRef(null);
  const localCompletedRef=useRef({}); // tracks what THIS user has explicitly set
  const clearingRef=useRef(false); // true briefly after clear — blocks poll from restoring old data
  useEffect(()=>{
    const iv=setInterval(async()=>{
      if(clearingRef.current) return; // skip poll while clearing
      const raw=await storageGet(COMPLETED_KEY,true);
      if(!raw||raw===lastCompletedRef.current) return;
      const parsed=safeParse(raw,null);
      if(!parsed||typeof parsed!=="object") return;
      lastCompletedRef.current=raw;
      // Merge: for each task, prefer local state if user explicitly set it,
      // otherwise accept incoming value from other users
      setCompleted(prev=>{
        const local=localCompletedRef.current;
        const merged={};
        const allPhases=new Set([...Object.keys(prev),...Object.keys(parsed)]);
        allPhases.forEach(ph=>{
          merged[ph]={};
          const prevPh=prev[ph]||{};
          const parsedPh=parsed[ph]||{};
          const localPh=local[ph]||{};
          const allTasks=new Set([...Object.keys(prevPh),...Object.keys(parsedPh)]);
          allTasks.forEach(tid=>{
            if(tid in localPh) merged[ph][tid]=localPh[tid];
            else merged[ph][tid]=!!(prevPh[tid]||parsedPh[tid]);
          });
        });
        return merged;
      });
    },2000);
    return()=>clearInterval(iv);
  },[]);

  // Save personal (only session notes)
  useEffect(()=>{
    if(!ready) return;
    const json=JSON.stringify({notes});
    if(json===lastPersonalRef.current) return;
    setSaveStatus("pending");
    const t=setTimeout(()=>{ lastPersonalRef.current=json; storageSet(PERSONAL_KEY,json,false).then(()=>setSaveStatus("saved")); },600);
    return()=>clearTimeout(t);
  },[notes,ready]);

  // Save shared
  useEffect(()=>{
    if(!ready) return;
    const json=JSON.stringify({roles,taskAssignments,taskTexts,taskDueDates,taskNotes,trackerColumns,raciData,examName,examNameNote,glossaryTerms,roleNames});
    if(json===lastSharedRef.current) return;
    setSaveStatus("pending");
    const t=setTimeout(()=>{ lastSharedRef.current=json; storageSet(SHARED_KEY,json,true).then(()=>setSaveStatus("saved")); },600);
    return()=>clearTimeout(t);
  },[roles,taskAssignments,taskTexts,taskDueDates,taskNotes,trackerColumns,raciData,examName,examNameNote,glossaryTerms,roleNames,ready]);

  // Save panelists immediately
  useEffect(()=>{
    if(!ready) return;
    const json=JSON.stringify(panelists);
    if(json===lastPanelistsRef.current) return;
    lastPanelistsRef.current=json;
    storageSet(PANELISTS_KEY,json,true);
  },[panelists,ready]);

  // Save docs immediately to their own key
  const lastDocsRef=useRef(null);
  const saveDocs=useCallback((newDocs)=>{
    const json=JSON.stringify(newDocs);
    lastDocsRef.current=json;
    storageSet(DOCS_KEY,json,true);
  },[]);
  // Also keep effect as backup
  useEffect(()=>{
    if(!ready) return;
    const json=JSON.stringify(docs);
    if(json===lastDocsRef.current) return;
    lastDocsRef.current=json;
    storageSet(DOCS_KEY,json,true);
  },[docs,ready]);

  // Save sessionDates immediately to their own key
  const lastDatesRef=useRef(null);
  useEffect(()=>{
    if(!ready) return;
    const json=JSON.stringify(sessionDates);
    if(json===lastDatesRef.current) return;
    lastDatesRef.current=json;
    storageSet(DATES_KEY,json,true);
  },[sessionDates,ready]);

  // Keep ref in sync and save name + avatar to personal storage
  useEffect(()=>{
    userNameRef.current=userName;
    if(ready&&userName) storageSet(USER_KEY,userName,false);
  },[userName,ready]);
  useEffect(()=>{
    if(ready) storageSet(AVATAR_KEY,userAvatar,false);
  },[userAvatar,ready]);

  const addLog=useCallback((action,detail)=>{
    const entry={id:makeId("log"),ts:new Date().toISOString(),action,detail,user:userNameRef.current||"Unknown"};
    setChangelog(prev=>{
      const next=[entry,...prev].slice(0,500);
      storageSet(CHANGELOG_KEY,JSON.stringify(next),true);
      return next;
    });
  },[]);

  const lastPanelistsRef=useRef(null);
  const toggleTask=useCallback((phaseKey,taskId)=>{
    setCompleted(prev=>{
      const wasDone=!!(prev[phaseKey]&&prev[phaseKey][taskId]);
      const phase=PHASES.find(p=>p.key===phaseKey);
      const task=DEFAULT_TASKS[phaseKey]?.find(t=>t.id===taskId);
      addLog(wasDone?"Task unchecked":"Task completed",`[${phase?.short||phaseKey}] ${task?.text||taskId}`);
      const next={...prev,[phaseKey]:{...prev[phaseKey],[taskId]:!wasDone}};
      // Record explicit local decision — poll will never overwrite this
      if(!localCompletedRef.current[phaseKey]) localCompletedRef.current[phaseKey]={};
      localCompletedRef.current[phaseKey][taskId]=!wasDone;
      const json=JSON.stringify(next);
      lastCompletedRef.current=json;
      storageSet(COMPLETED_KEY,json,true);
      return next;
    });
  },[addLog]);
  const updateNotes=useCallback((pk,v)=>{
    setNotes(prev=>({...prev,[pk]:v}));
    // Log only when non-empty
    if(v&&v.trim()) addLog("Notes updated",PHASES.find(p=>p.key===pk)?.short||pk);
  },[addLog]);
  const noteLogTimerRef=useRef({});
  const updateTaskNote=useCallback((taskId,val)=>{
    setTaskNotes(prev=>{const n={...prev};if(val)n[taskId]=val;else delete n[taskId];return n;});
    // Debounce the log entry — only fire after user stops typing for 1.5s
    if(noteLogTimerRef.current[taskId]) clearTimeout(noteLogTimerRef.current[taskId]);
    if(val&&val.trim()){
      noteLogTimerRef.current[taskId]=setTimeout(()=>{
        const isAssignee=taskId.endsWith("__assignee");
        const realId=isAssignee?taskId.replace("__assignee",""):taskId;
        let taskText=realId;
        for(const phase of PHASES){const t=DEFAULT_TASKS[phase.key]?.find(t=>t.id===realId);if(t){taskText=t.text.slice(0,60);break;}}
        addLog(isAssignee?"Assignee set":"Task note updated",`${taskText}: ${val.trim().slice(0,60)}`);
      },1500);
    }
  },[addLog]);


  // ── Generate proper .docx using docx library via CDN ──────────────────────
  function generateDocx(data){
    const NAVY="1A1048",PURPLE="7C3AED",MUTED="64748B",WHITE="FFFFFF",GREEN="2F9E44";
    const ROLE_COLORS={pm:"0D7490",program:"475569",psych:"3E63DD",pf:"2F9E44",cf:"E8590C",dqa:"7048E8",rs:"C2255C"};
    const ROLE_LABELS={pm:"Program Manager",program:"Program",psych:"Psychometrician",pf:"Process Facilitator",cf:"Content Facilitator",dqa:"Data Quality Analyst",rs:"Research Scientist"};
    const DATE_LABELS={kickoff:"Kickoff Meeting",dryrun:"Dry Run Meeting",day1:"Day 1 — VBSS",day2:"Day 2 — VBSS",day3:"Day 3 — VBSS",gradesetting:"Grade Setting Meeting",retro:"Retrospective Meeting"};
    const RACI_COLORS={R:"DCF5E3",A:"DCE8FF",C:"FEF0E6",I:"F3F0FC"};
    const {examName,exportedAt,sessionDates={},roleNames={},panelists=[],completed={},taskTexts={},taskDueDates={},taskNotes={},raciData=[],glossaryTerms=[],docs=[],changelog=[]}=data;

    function fmtDate(d){try{return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});}catch(e){return d||"—";}}
    function fmtTs(ts){try{return new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return ts;}}
    function hex(h){return{red:parseInt(h.slice(0,2),16),green:parseInt(h.slice(2,4),16),blue:parseInt(h.slice(4,6),16)};}
    function shading(fill){return{type:"clear",color:"auto",fill};}
    function boldRun(text,color=NAVY,size=20){return new docx.TextRun({text,bold:true,color,size,font:"Calibri"});}
    function run(text,color="2B2244",size=20,bold=false){return new docx.TextRun({text,color,size,bold,font:"Calibri"});}
    function para(children,opts={}){return new docx.Paragraph({children,spacing:{after:80,...(opts.spacing||{})},alignment:opts.align||"left",...opts});}
    function heading(text,color=PURPLE){return new docx.Paragraph({children:[new docx.TextRun({text:text.toUpperCase(),bold:true,color,size:22,font:"Calibri"})],spacing:{before:280,after:80},border:{bottom:{style:"single",size:4,color:"D0C8F0",space:4}}});}
    function tableCell(children,bg,bold=false,color="2B2244",size=18){
      return new docx.TableCell({children:[new docx.Paragraph({children:Array.isArray(children)?children:[new docx.TextRun({text:String(children||""),bold,color,size,font:"Calibri"})],spacing:{before:40,after:40}})],shading:shading(bg),margins:{top:60,bottom:60,left:100,right:100}});
    }
    function hdrCell(text,bg){return tableCell(text,bg,true,WHITE,17);}
    function stripeRow(i){return i%2===0?"F7F5FB":"FFFFFF";}
    function dataRow(cells){return new docx.TableRow({children:cells});}

    const children=[];

    // Title
    children.push(new docx.Paragraph({children:[new docx.TextRun({text:examName||"CLEP",bold:true,color:NAVY,size:52,font:"Calibri"})],alignment:"center",spacing:{before:600,after:120}}));
    children.push(new docx.Paragraph({children:[run("Video-Based Standard Setting — Session Record",PURPLE,26)],alignment:"center",spacing:{after:80}}));
    if(exportedAt) children.push(new docx.Paragraph({children:[run("Exported: "+fmtTs(exportedAt),MUTED,18)],alignment:"center",spacing:{after:400}}));
    children.push(new docx.Paragraph({border:{bottom:{style:"single",size:6,color:"D0C8F0",space:4}},spacing:{after:240}}));

    // Session Dates
    const datesArr=Object.entries(sessionDates).filter(([,v])=>v);
    if(datesArr.length){
      children.push(heading("Session Dates"));
      children.push(new docx.Table({width:{size:100,type:"pct"},rows:datesArr.map(([k,v],i)=>dataRow([tableCell(DATE_LABELS[k]||k,stripeRow(i),true,NAVY),tableCell(fmtDate(v),stripeRow(i))]))}));
      children.push(para([]));
    }

    // Team Members
    const membersArr=Object.entries(roleNames).filter(([,v])=>v);
    if(membersArr.length){
      children.push(heading("Team Members"));
      children.push(new docx.Table({width:{size:100,type:"pct"},rows:membersArr.map(([k,v],i)=>dataRow([tableCell(ROLE_LABELS[k]||k,stripeRow(i),true,NAVY),tableCell(v,stripeRow(i))]))}));
      children.push(para([]));
    }

    // Panelists
    if(panelists.length){
      children.push(heading(`Panelists (${panelists.length})`));
      const cols=["name","table_group","panelist_id","panelist_code","phone"];
      const hdrs=["Name","Table Group","Panelist ID","Code","Phone"];
      children.push(new docx.Table({width:{size:100,type:"pct"},rows:[
        dataRow(hdrs.map(h=>hdrCell(h,"4B3880"))),
        ...panelists.map((p,i)=>dataRow(cols.map(c=>tableCell(String(p[c]||""),stripeRow(i)))))
      ]}));
      children.push(para([]));
    }

    // Tasks by phase
    children.push(heading("Tasks by Phase"));
    PHASES.forEach(ph=>{
      const phaseTasks=DEFAULT_TASKS[ph.key];
      const phComp=completed[ph.key]||{};
      const doneCount=phaseTasks.filter(t=>phComp[t.id]).length;
      children.push(para([boldRun(`${ph.label}`,NAVY,22)],{spacing:{before:200,after:40}}));
      children.push(para([run(`${doneCount} of ${phaseTasks.length} tasks completed`,MUTED,18)],{spacing:{after:80}}));
      phaseTasks.forEach(t=>{
        const done=!!phComp[t.id];
        const text=(taskTexts[t.id]||t.text).replace(/\\\/'/g,"'");
        const due=taskDueDates[t.id];
        const assignee=(taskNotes[t.id+"__assignee"]||"").trim();
        const note=(taskNotes[t.id]||"").trim();
        const checkRuns=[new docx.TextRun({text:(done?"☑  ":"☐  "),color:done?GREEN:MUTED,size:20,font:"Calibri"}),new docx.TextRun({text,color:done?GREEN:"2B2244",size:20,font:"Calibri"})];
        if(due) checkRuns.push(new docx.TextRun({text:"  · Due: "+fmtDate(due),color:MUTED,size:18,font:"Calibri"}));
        children.push(new docx.Paragraph({children:checkRuns,indent:{left:360},spacing:{after:40},bullet:{level:0}}));
        if(assignee) children.push(para([run("RS: "+assignee,MUTED,17)],{indent:{left:720},spacing:{before:0,after:20}}));
        if(note) children.push(para([run("Note: "+note,MUTED,17)],{indent:{left:720},spacing:{before:0,after:20}}));
      });
    });

    // RACI Matrix
    if(raciData.length){
      children.push(heading("RACI Matrix"));
      const rkeys=["pm","program","psych","pf","cf","dqa","rs"];
      const rhdrs=["PM","Program","Psych","PF","CF","DQA","RS"];
      children.push(new docx.Table({width:{size:100,type:"pct"},rows:[
        dataRow([hdrCell("Task Category","4B3880"),...rkeys.map((k,i)=>hdrCell(rhdrs[i],ROLE_COLORS[k]||"4B3880"))]),
        ...raciData.map((row,ri)=>dataRow([
          tableCell(row.category,stripeRow(ri),true,NAVY,17),
          ...rkeys.map(k=>{const v=row.raci?.[k];return tableCell(v||"",v&&RACI_COLORS[v]?RACI_COLORS[v]:stripeRow(ri),!!v,"2B2244",20);})
        ]))
      ]}));
      children.push(para([]));
    }

    // Documents
    if(docs.length){
      children.push(heading("Documents & Links"));
      docs.forEach(d=>{
        const runs=[boldRun(d.title||"Untitled",NAVY,20)];
        if(d.url) runs.push(run("  "+d.url,"0D7490",18));
        children.push(new docx.Paragraph({children:runs,bullet:{level:0},spacing:{after:60}}));
      });
      children.push(para([]));
    }

    // Glossary
    if(glossaryTerms.length){
      children.push(heading("Glossary"));
      [...glossaryTerms].sort((a,b)=>a.term.localeCompare(b.term)).forEach(t=>{
        children.push(para([boldRun(t.term+": ",NAVY,20),run(t.def,"2B2244",20)],{spacing:{after:80}}));
      });
      children.push(para([]));
    }

    // Change Log
    if(changelog.length){
      children.push(heading(`Change Log (${changelog.length} entries)`));
      const clRows=changelog.slice(0,300).map((e,i)=>dataRow([
        tableCell(fmtTs(e.ts||""),stripeRow(i),false,MUTED,16),
        tableCell(e.action||"",stripeRow(i),true,"2B2244",17),
        tableCell((e.detail||"").slice(0,80),stripeRow(i),false,MUTED,16),
        tableCell(e.user||"",stripeRow(i),false,"2B2244",16),
      ]));
      children.push(new docx.Table({width:{size:100,type:"pct"},rows:[
        dataRow(["Timestamp","Action","Detail","By"].map(h=>hdrCell(h,"4B3880"))),
        ...clRows
      ]}));
    }

    // Build and save doc
    const doc=new docx.Document({sections:[{properties:{page:{size:{width:12240,height:15840},margin:{top:1440,bottom:1440,left:1584,right:1584}}},children}]});
    docx.Packer.toBlob(doc).then(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      const stamp=new Date().toISOString().slice(0,10);
      a.href=url; a.download=`CLEP_VBSS_Record_${(examName||"Session").replace(/\\s+/g,"_")}_${stamp}.docx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }).catch(err=>{console.error("docx generation failed:",err);});
  }

  function handleExportData(){
    addLog("App data exported",`${examName||"CLEP"} session record`);
    const data={
      exportedAt:new Date().toISOString(),
      examName,examNameNote,sessionDates,roleNames,
      panelists,taskAssignments,taskTexts,taskDueDates,taskNotes,
      completed,notes,raciData,glossaryTerms,docs,changelog,
    };
    const json=JSON.stringify(data,null,2);
    const stamp=new Date().toISOString().slice(0,10);
    const filename=`CLEP_VBSS_Record_${(examName||"Session").replace(/\s+/g,"_")}_${stamp}.json`;
    // Try direct download first, fall back to data URI
    try{
      const blob=new Blob([json],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download=filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }catch(e){
      // Fallback: data URI
      const a=document.createElement("a");
      a.href="data:application/json;charset=utf-8,"+encodeURIComponent(json);
      a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    return;
  }

  function handleClearData(){
    addLog("App data cleared","All session data reset for new session");
    const def=defaultShared();
    setPanelists([]); setRoles(def.roles);
    setTaskAssignments(def.taskAssignments); setTaskTexts({});
    setTaskDueDates({}); setRaciData(DEFAULT_RACI.map(r=>({...r,raci:{...r.raci}})));
    setExamName("CLEP"); setExamNameNote(""); setDocs([]);
    lastDocsRef.current="[]"; storageSet(DOCS_KEY,"[]",true);
    const emptyDates={kickoff:"",dryrun:"",day1:"",day2:"",day3:"",gradesetting:"",retro:""};
    setSessionDates(emptyDates);
    lastDatesRef.current=JSON.stringify(emptyDates);
    storageSet(DATES_KEY,JSON.stringify(emptyDates),true);
    setGlossaryTerms(DEFAULT_GLOSSARY_TERMS.map(t=>({...t}))); setRoleNames({});
    setTaskNotes({}); setTrackerColumns(Object.fromEntries(ALL_TRACKER_COLS.map(c=>[c.key,true])));
    const emptyComp={}; PHASES.forEach(p=>{emptyComp[p.key]={};}); setCompleted(emptyComp);
    lastCompletedRef.current=JSON.stringify(emptyComp);
    localCompletedRef.current={};
    clearingRef.current=true;
    storageSet(COMPLETED_KEY,JSON.stringify(emptyComp),true).then(()=>{
      // Keep blocking poll for 5s to ensure write propagates before poll resumes
      setTimeout(()=>{clearingRef.current=false;},5000);
    });
    lastPanelistsRef.current="[]";
    storageSet(PANELISTS_KEY,"[]",true);
    // Reset UI state
    setGlobalRoleFilter([]);
    // Clear personal
    const defP=defaultPersonal();
    setNotes(defP.notes);
  }

  // Global RS names derived from ALL assignee fields across all phases
  const globalRsNames=useMemo(()=>{
    const names=new Set();
    PHASES.forEach(p=>{
      DEFAULT_TASKS[p.key].forEach(t=>{
        if(!t.hasAssignee) return;
        const val=(taskNotes&&taskNotes[t.id+"__assignee"])||"";
        if(!val.trim()) return;
        val.split(/[,;]/).forEach(n=>{const trimmed=n.trim(); if(trimmed) names.add(trimmed);});
      });
    });
    return Array.from(names).sort().map(name=>({name,key:"rs__"+name.toLowerCase().replace(/\s+/g,"_")}));
  },[taskNotes]);

  const updateDueDate=useCallback((taskId,v)=>{
    setTaskDueDates(prev=>{const n={...prev};if(v)n[taskId]=v;else delete n[taskId];return n;});
    if(v){
      // find task text
      let taskText=taskId;
      for(const phase of PHASES){ const t=DEFAULT_TASKS[phase.key]?.find(t=>t.id===taskId); if(t){taskText=t.text;break;} }
      addLog("Due date set",`${taskText.slice(0,60)} → ${v}`);
    }
  },[addLog]);

  const stats=useMemo(()=>{
    const s={};
    PHASES.forEach(p=>{
      const total=DEFAULT_TASKS[p.key].length;
      const done=DEFAULT_TASKS[p.key].filter(t=>completed[p.key]&&completed[p.key][t.id]).length;
      s[p.key]={done,total};
    });
    return s;
  },[completed]);

  const activePhase=PHASES.find(p=>p.key===page);

  let content=null;
  if(page==="dashboard")  content=<Dashboard stats={stats} setPage={setPage} panelistCount={panelists.length} roles={roles} examName={examName} sessionDates={sessionDates}/>;
  else if(activePhase)    content=<TaskPhasePage phase={activePhase} roles={roles} taskAssignments={taskAssignments} taskTexts={taskTexts} taskDueDates={taskDueDates} onDueDateChange={updateDueDate} examName={examName} completedMap={completed[activePhase.key]||{}} notes={notes[activePhase.key]||""} onToggleTask={toggleTask} onNotesChange={updateNotes} sessionDates={sessionDates} taskNotes={taskNotes} onTaskNoteChange={updateTaskNote} roleFilter={globalRoleFilter} setRoleFilter={setGlobalRoleFilter} rsNames={globalRsNames}/>;
  else if(page==="tracker") content=<Tracker panelists={panelists} setPanelists={setPanelists} trackerColumns={trackerColumns} setTrackerColumns={setTrackerColumns} addLog={addLog}/>;
  else if(page==="docs")    content=<DocsPage docs={docs} setDocs={setDocs} saveDocs={saveDocs} addLog={addLog}/>;
  else if(page==="processflow") content=<ProcessFlowPage setPage={setPage} sessionDates={sessionDates} stats={stats}/>;
  else if(page==="raci")    content=<RaciMatrix raciData={raciData} setRaciData={setRaciData} roles={roles} addLog={addLog}/>;
  else if(page==="glossary") content=<Glossary glossaryTerms={glossaryTerms} setGlossaryTerms={setGlossaryTerms} addLog={addLog}/>;
  else if(page==="admin")   content=<TaskEditor examName={examName} taskTexts={taskTexts} setTaskTexts={setTaskTexts} taskAssignments={taskAssignments} setTaskAssignments={setTaskAssignments} taskDueDates={taskDueDates} setTaskDueDates={setTaskDueDates} roles={roles} setRoles={setRoles} setExamName={setExamName} roleNames={roleNames} setRoleNames={setRoleNames} addLog={addLog}/>;
  else if(page==="settings") content=<SettingsPage examName={examName} setExamName={setExamName} examNameNote={examNameNote} setExamNameNote={setExamNameNote} sessionDates={sessionDates} setSessionDates={setSessionDates} onExportData={handleExportData} onClearData={handleClearData} addLog={addLog}/>;
else if(page==="changelog") content=<ChangeLog changelog={changelog} setChangelog={setChangelog} examName={examName}/>;

  return(
    <div className="app">
      <style>{STYLES}</style>
      {showNamePrompt&&<UserNamePrompt onSave={(name,avatar)=>{setUserName(name);if(avatar!==undefined)setUserAvatar(avatar);setShowNamePrompt(false);storageSet(USER_KEY,name,false);if(avatar!==undefined)storageSet(AVATAR_KEY,avatar,false);}}/>}
      <TopBar page={page} userName={userName} userAvatar={userAvatar} onChangeName={()=>setShowNamePrompt(true)}/>
      <div className="body-row">
        <Sidebar page={page} setPage={setPage} stats={stats} examName={examName} saveStatus={saveStatus}/>
        <main className="main">
          {!ready?<div className="loading">Loading your session…</div>:content}
        </main>
      </div>
    </div>
  );
}




window._mountApp = function() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(App));
};
</script>

</body>
</html>
